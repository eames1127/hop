name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Third-party actions are pinned to commit SHAs so a moved tag cannot change what runs.
# No build caches here: installers are built from a clean install, so a tampered cache can
# never end up in a release.

jobs:
  # Runs before anything is built, so a tag that doesn't match the app's version fails in seconds
  # instead of producing installers with the wrong version in their names.
  prepare:
    name: Check the version and read the release notes
    runs-on: ubuntu-22.04
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in tauri.conf.json"
            exit 1
          fi
          echo "Tag $TAG matches version $version"
      - name: Release notes from docs/releases
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          file="docs/releases/$TAG.md"
          delimiter="notes_$(openssl rand -hex 16)"
          {
            echo "notes<<$delimiter"
            if [ -f "$file" ]; then
              cat "$file"
            else
              echo "Download the installer for your machine below."
            fi
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build installers (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Hop ${{ github.ref_name }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          # 0.x versions are betas, so GitHub marks them as pre-releases.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: --bundles ${{ matrix.bundles }}

  # The installers are unsigned, so publish SHA-256 checksums that testers can check a download
  # against. Hashing the files downloaded back from the release covers exactly what users get.
  # This job never checks out or runs repository code.
  checksums:
    name: Publish SHA-256 checksums
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Hash the release's files and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets
          cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          # A rerun downloads the previous checksum file too; it must not hash itself.
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
