# Personal hosts

Include conf.d/*.conf

Host nas
	# desc: Synology NAS for backups and media
	# tags: home, storage
	# fav: true
	# forward: 5001:localhost:5001 Admin UI
	# added: 2025-03-14
	HostName 192.0.2.20
	User alex
	IdentityFile ~/.ssh/id_ed25519

# Raspberry Pi in the shed
Host pi
    HostName pi.lan
    User pi
    Port 2222

Host *
    ServerAliveInterval 30
    AddKeysToAgent yes
